name: Deploy to GitHub Pages

on:
  # Every push to main publishes the site.
  #
  # To move to a bought domain: put it in astro.config.mjs, add public/CNAME
  # with that same domain on one line, and point the DNS at GitHub Pages.
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default. Each job asks only for what it needs, and none of them
# can write to the repository.
permissions: {}

# One deploy at a time. A queued run waits instead of cancelling a deploy that
# is already live, which is what GitHub recommends for Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      # Publishing is public, so stop if anything unfinished or private made it
      # into the site: a TODO, the placeholder domain, or a phone number. The
      # text inside a PDF is compressed, so the CV is read with pdftotext first.
      - name: Refuse to publish unfinished or private content
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null
          placeholder='TODO\(Manuel\)|example\.com'
          phone='(\+|00)351|9[1236][0-9]([ .-]?[0-9]{3}){2}'
          found=0
          if grep -rnoIE "$placeholder" astro.config.mjs src public; then found=1; fi
          # SVGs are skipped for phones: their embedded fonts are long base64 runs.
          if grep -rnoIE --exclude='*.svg' "$phone" astro.config.mjs src public; then found=1; fi
          shopt -s nullglob
          for pdf in public/*.pdf; do
            text="$(pdftotext "$pdf" -)"
            if grep -noE "$placeholder|$phone" <<< "$text"; then echo "  in $pdf"; found=1; fi
          done
          if [ "$found" = 1 ]; then
            echo "::error::Unfinished or private content above. Fix it before publishing."
            exit 1
          fi

      - run: npm ci

      - name: Type-check the site
        run: npm run astro check

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Publish to Pages, with a short-lived token that proves who is deploying.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
